<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Profesor - MFC</title>
  <link rel="stylesheet" href="./assets/app.css">
  <style>
    .prof-content { max-width: 1280px; }
    .prof-grid {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    .prof-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px;
    }
    .prof-assignment {
      width: 100%;
      border: 1px solid var(--stroke);
      background: var(--panel2);
      color: var(--txt);
      border-radius: 8px;
      padding: 11px 12px;
      cursor: pointer;
      text-align: left;
    }
    .prof-assignment strong,
    .prof-assignment span {
      display: block;
    }
    .prof-assignment strong {
      font-size: 14px;
      margin-bottom: 3px;
    }
    .prof-assignment span {
      color: var(--muted);
      font-size: 12px;
    }
    .prof-assignment.active {
      border-color: var(--blue);
      background: rgba(37, 99, 235, 0.06);
    }
    .prof-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 14px;
      border-bottom: 1px solid var(--stroke);
    }
    .prof-tools select {
      width: auto;
      min-width: 180px;
    }
    .prof-note-input {
      width: 68px;
      text-align: center;
      padding: 7px 8px;
      border-radius: 8px;
    }
    .prof-empty {
      padding: 34px 18px;
      color: var(--muted);
      text-align: center;
    }
    .prof-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      border-radius: 8px;
      padding: 4px 8px;
      font-weight: 800;
      background: var(--panel2);
    }
    .prof-chip.ok { color: #065f46; background: rgba(16, 185, 129, .12); }
    .prof-chip.warn { color: #92400e; background: rgba(245, 158, 11, .14); }
    .prof-chip.bad { color: #991b1b; background: rgba(239, 68, 68, .12); }
    @media (max-width: 900px) {
      .prof-grid { grid-template-columns: 1fr; }
      .topbar-right .pill { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <span class="brand-mini">MFC</span>
      <span>Portal Profesor</span>
    </div>
    <div class="topbar-right">
      <span class="pill" id="profRole">PROFESOR</span>
      <button class="btn-outline" id="btnPerfilProfesor">Mi perfil</button>
      <button class="btn-outline" id="btnLogout">Salir</button>
    </div>
  </header>

  <main class="content prof-content">
    <div class="content-header">
      <div>
        <h1>Academico</h1>
        <p class="muted" id="profSubtitle">Calificaciones por materia</p>
      </div>
      <div class="userbox">
        <div class="avatar" id="profAvatar">P</div>
        <div>
          <div class="user-name" id="profName">Profesor</div>
          <div class="user-sub muted" id="profCedula">Cedula: -</div>
        </div>
      </div>
    </div>

    <div class="alert" id="profAlert" hidden></div>

    <div class="prof-grid">
      <aside class="card">
        <div class="card-head">
          <h3>Materias</h3>
        </div>
        <div id="profAssignments" class="prof-list">
          <div class="prof-empty">Cargando...</div>
        </div>
      </aside>

      <section class="card">
        <div class="prof-tools">
          <div>
            <h3 id="profCurrentTitle">Seleccione una materia</h3>
            <p class="muted" id="profCurrentMeta">-</p>
          </div>
          <select id="profTrimSelect" disabled></select>
        </div>
        <div id="profNotesPanel">
          <div class="prof-empty">Seleccione una materia para cargar notas.</div>
        </div>
      </section>
    </div>
  </main>

  <script src="./assets/js/profesor-academico.js"></script>
</body>
</html>
